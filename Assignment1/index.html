<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Racing Game</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <main class="container">
      <div class="sideboxes leftbox">
        <h2 class="sidebox-heading">Score board</h2>
        <div class="line"></div>
        <div class="content">
        <p>Score</p>
        <h3>001250</h3>
        </div>
        <div class="content">
        <p>Speed</p>
        <h3>120 <span>km/h</span></h3>
        </div>
        <div class="content">
        <p>Level</p>
        <h3>4</h3>
        </div>
      </div>

      <div class="game">
        <i class="fa-solid fa-car firstcar"></i>
        <i class="fa-solid fa-car seccar"></i>
        <i class="fa-solid fa-car thirdcar"></i>
        <i class="fa-solid fa-car fourthcar"></i>
        <i class="fa-solid fa-car playercar"></i>
        <div class="lane-line"></div>
      </div>

      <div class="sideboxes rightbox">
        <h2 class="sidebox-heading lowerbox-heading">How to play</h2>
        <div class="line"></div>
        <ul>
          <li>Stay inside the road.</li>
          <li>Avoid the red enemy cars.</li>
          <li>Survive longer to score higher.</li>
        </ul>
        <button type="button">START RACE</button>
      </div>
    </main>
</body>
</html>
