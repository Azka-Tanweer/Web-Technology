<!DOCTYPE html>
<html lang="en">
<head>
<title>Student Portal Web Page</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
    <div class="container">
        <ul class="nav nav-tabs">
            <h1>Student Portal</h1>
            <li class="active"><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Programs</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
        <div class="alert alert-success">
            <strong>Welcome</strong> to Your Student Portal!
        </div>
    </div>

    <div class="container">
        <div class="row">
            <div class="col-sm-6">
                <ul class="list-group">
                    <li class="list-group-item">Dashboard <span class="badge">^</span></li>
                    <li class="list-group-item">Courses <span class="badge">^</span></li>
                    <li class="list-group-item">Assignments <span class="badge">^</span></li>
                    <li class="list-group-item">Results <span class="badge">^</span></li>
                </ul>
            </div>

            <div class="col-sm-6">
                <table class="table">
                    <thead>
                        <tr>
                        <th>Student ID</th>
                        <th>Name</th>
                        <th>Course</th>
                        <th>Grade</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                        <td>111</td>
                        <td>Azka</td>
                        <td>Web</td>
                        <td>A+</td>
                        </tr>
                        <tr>
                        <td>111</td>
                        <td>Azka</td>
                        <td>Web</td>
                        <td>A+</td>
                        </tr>
                        <tr>
                        <td>111</td>
                        <td>Azka</td>
                        <td>Web</td>
                        <td>A+</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="container">
        <button type="button" class="btn-primary">Button</button>
        <button type="button" class="btn-success">Pass</button>
        <button type="button" class="btn-danger">Fail</button>
    </div>

    <div class="container">
        <ul class="pagination pagination">
        <li><a href="#">1</a></li>
        <li><a href="#">2</a></li>
        <li><a href="#">3</a></li>
        <li><a href="#">4</a></li>
        <li><a href="#">5</a></li>
        </ul>
    </div>
</body>
</html>
